name: Playzone tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playzone
          POSTGRES_PASSWORD: playzone-test-password
          POSTGRES_DB: playzone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playzone -d playzone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: playzone-app
    env:
      TEST_DATABASE_URL: postgres://playzone:playzone-test-password@localhost:5432/playzone_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playzone-app/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run integration tests
        run: npm test
